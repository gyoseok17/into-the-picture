services:
  frontend:
    image: gyoseok/into-the-picture-frontend:${APP_IMAGE_TAG:-m8.3}
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in backend/.env}
    depends_on:
      backend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  backend:
    image: gyoseok/into-the-picture-backend:${APP_IMAGE_TAG:-m8.3}
    env_file:
      - .env
    environment:
      # Local storage keeps files outside the image layer. This value is ignored
      # when APP_STORAGE_TYPE=s3 is supplied through backend/.env.
      APP_STORAGE_LOCAL_DIR: /app/uploads
      # This Compose file is an HTTPS deployment path. Do not allow a value
      # from .env to accidentally issue the refresh cookie without Secure.
      APP_AUTH_REFRESH_COOKIE_SECURE: "true"
    expose:
      - "8080"
    volumes:
      - itp-uploads:/app/uploads
    restart: unless-stopped

volumes:
  itp-uploads:
  caddy_data:
  caddy_config:
