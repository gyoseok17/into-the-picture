services:
  mysql:
    image: mysql:8.0
    container_name: itp-mysql
    environment:
      MYSQL_DATABASE: into_the_picture
      MYSQL_USER: itp
      MYSQL_PASSWORD: itp1234
      MYSQL_ROOT_PASSWORD: root1234
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - itp-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot1234"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  itp-mysql-data:
