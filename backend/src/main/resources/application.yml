spring:
  application:
    name: into-the-picture
  config:
    # backend/.env is a gitignored Java-properties-compatible file.
    # The relative path is resolved from the backend module during Gradle runs.
    # Local Gradle runs load backend/.env; Docker/production inject the same
    # names as environment variables, so the file itself is optional there.
    import: optional:file:.env[.properties]
  datasource:
    # Supabase credentials must come from backend/.env or deployment environment variables.
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    # Never commit the actual password; inject DB_PASSWORD through backend/.env or deployment secrets.
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      # 스키마 단일 진실은 Flyway. 환경에서 검증된 DB 가 있으면 validate 로 올려도 됨(M-later).
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      # Three 10MB files plus multipart field/boundary overhead.
      max-request-size: 32MB

# 외부 API(관광공사·카카오). 키는 .env 의 환경변수로 주입(코드/설정 하드코딩 금지).
external:
  tour:
    base-url: https://apis.data.go.kr/B551011
    service-key: ${DATA_GO_KR_KEY}
    mobile-os: ETC
    mobile-app: IntoThePicture
  kakao:
    base-url: https://dapi.kakao.com
    rest-key: ${KAKAO_REST_KEY}
    client-secret: ${KAKAO_CLIENT_SECRET}

# CORS 허용 출처 화이트리스트(docs/09). 환경변수 APP_CORS_ALLOWED_ORIGINS 로 override.
app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-seconds: 900
    refresh-token-seconds: 1209600
  auth:
    refresh-cookie:
      # Local HTTP development keeps this false. Set APP_AUTH_REFRESH_COOKIE_SECURE=true in HTTPS production.
      secure: ${APP_AUTH_REFRESH_COOKIE_SECURE:false}
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:4173
      - http://localhost
      - https://localhost
      - capacitor://localhost

logging:
  level:
    org.hibernate.SQL: info
