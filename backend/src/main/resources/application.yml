spring:
  application:
    name: into-the-picture
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마 단일 진실은 Flyway. 환경에서 검증된 DB 가 있으면 validate 로 올려도 됨(M-later).
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

# 외부 API(관광공사·카카오). 키는 .env 의 환경변수로 주입(코드/설정 하드코딩 금지).
external:
  tour:
    base-url: https://apis.data.go.kr/B551011
    service-key: ${DATA_GO_KR_KEY:}
    mobile-os: ETC
    mobile-app: IntoThePicture
  kakao:
    base-url: https://dapi.kakao.com
    rest-key: ${KAKAO_REST_KEY:}

# CORS 허용 출처 화이트리스트(docs/09). 환경변수 APP_CORS_ALLOWED_ORIGINS 로 override.
app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:4173
      - http://localhost
      - https://localhost
      - capacitor://localhost

logging:
  level:
    org.hibernate.SQL: info
