plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.intothepicture'
version = '0.0.1-SNAPSHOT'

java {
    // docs/01: Java 17+. 설치 JDK(21)로 빌드하되 17 호환 바이트코드로 타깃.
    sourceCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

ext {
    jjwtVersion = '0.12.6'
}

dependencies {
    // --- web / validation ---
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // --- persistence (JPA + Flyway + PostgreSQL/Supabase) ---
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // --- cache: 외부 API 응답 캐싱 seam (external 어댑터가 @Cacheable 로 사용) ---
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // --- security: M1 은 최소 SecurityConfig(permitAll + CORS), JWT 필터는 M2 ---
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // JPEG EXIF에서 촬영 시각만 읽는다. 위치(GPS) 메타데이터는 사용하지 않는다.
    implementation 'com.drewnoakes:metadata-extractor:2.19.0'

    // 외부 API 호출은 동기 RestClient(spring-web 내장) 표준. 별도 HTTP 클라이언트 의존성 불필요.

    // --- JWT (M2 인증에서 사용; 의존성만 선반영) ---
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // --- lombok ---
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // --- test ---
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
